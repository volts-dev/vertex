<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes">

  <title>ve-dropdown-button demo</title>

  <script src="../node_modules/@webcomponents/webcomponentsjs/webcomponents-loader.js"></script>

  <script type="module">
    import '@polymer/iron-demo-helpers/demo-pages-shared-styles';
    import '@polymer/iron-demo-helpers/demo-snippet';
  </script>

  <script type="module" src="../ve-dropdown-button.js"></script>

  <custom-style>
    <style is="custom-style" include="demo-pages-shared-styles">
    </style>
  </custom-style>
</head>

<body>
  <div class="vertical-section-container centered">
    <h3>Basic ve-dropdown-button demo</h3>
    <demo-snippet>
      <template>
        <ve-dropdown-button >
          <button slot="dropdown-trigger">TEST1</button>
          <ul slot="dropdown-content">
            <a class="menu package" is="app-link" href$="[[_menuLink(submenu)]]" active$="[[_isEqual(package,submenu.name)]]"
              tabindex="[[index]]">
              <div class="layout horizontal center">
                <package-symbol aria-hidden="true" package="[[submenu]]"></package-symbol>
                <span class="title flex">TEST content</span>
              </div>
            </a>
          </ul>
        </ve-dropdown-button>
        <ve-dropdown-button>
          <button class="dropdown-trigger" slot="dropdown-trigger">TEST4</button>
          <ul class="dropdown-content" slot="dropdown-content">
            gsfdgsdfgsfd
          </ul>
        </ve-dropdown-button>
      </template>
    </demo-snippet>
  </div>
</body>

</html>
